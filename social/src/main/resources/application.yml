spring:
  application:
    name: social-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/social_db
    username: social_user
    password: ${SOCIAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

aws:
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  region: ${AWS_REGION:us-east-1}
  sns:
    social-events-topic-arn: ${AWS_SOCIAL_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:social-events}
  sqs:
    social-user-events-queue-url: ${AWS_SOCIAL_USER_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/social-user-events-queue}
    social-match-events-queue-url: ${AWS_SOCIAL_MATCH_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/social-match-events-queue.fifo}

server:
  port: 8081

springdoc:
  show-actuator: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
