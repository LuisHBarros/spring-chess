name: CI Pipeline

on:
  push:
    branches: [ main, master, development, production, prod ]
  pull_request:
    branches: [ main, master, development, production, prod ]

jobs:
  build-and-test:
    name: Build, Test & Enforce Code Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Auth Service Tests & Verify Coverage
        working-directory: ./auth
        run: mvn clean verify

      - name: Run Social Service Tests & Verify Coverage
        working-directory: ./social
        run: mvn clean verify

      - name: Upload Auth JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report-auth
          path: auth/target/site/jacoco/

      - name: Upload Social JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report-social
          path: social/target/site/jacoco/
