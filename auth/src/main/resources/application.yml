spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth_user
    password: auth_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

aws:
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  region: ${AWS_REGION:us-east-1}
  sns:
    user-events-topic-arn: ${AWS_USER_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:user-events}
    match-events-topic-arn: ${AWS_MATCH_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:match-events.fifo}
  sqs:
    auth-match-events-queue-url: ${AWS_AUTH_MATCH_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/auth-match-events-queue.fifo}

server:
  port: 8080

springdoc:
  show-actuator: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
